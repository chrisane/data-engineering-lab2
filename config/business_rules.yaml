company:
  name: Nawa Retail Group
  currency: NAD
  financial_year_start_month: 1
  vat_rate: 0.15

operations:
  branch_count: 12
  distribution_centres: 1
  head_office: 1
  branch_replenishment:
    reorder_trigger_pct: 0.35
    target_stock_pct: 0.85
  central_distribution:
    stocked_categories:
      - Grocery
      - Household
      - Beverages
      - Personal Care
      - Stationery
    direct_supplier_categories:
      - Specialized Equipment
      - Local Specialty
  supplier_minimum_order_value:
    enabled: true
    min_nad: 5000
    max_nad: 50000
  rebates:
    enabled: true
    quarterly_thresholds:
      - threshold: 250000
        rate: 0.01
      - threshold: 500000
        rate: 0.02
      - threshold: 1000000
        rate: 0.035

inventory:
  allow_negative_stock: false
  valuation_method: weighted_average
  stock_adjustments_require_reason: true
  intersite_transfers_use_transfer_document: true

assets:
  erp_capitalisation_threshold_nad: 10000
  depreciation_method: straight_line
  major_asset_classes:
    Vehicles: 5
    Computer Hardware: 3
    Servers and Network Equipment: 4
    Machinery and Equipment: 5
    Furniture and Fittings: 6
  local_register_examples:
    - Chairs
    - Tables
    - Bookcases
    - CCTV components
    - Small IT peripherals
  unique_erp_asset_number: true

finance:
  double_entry_required: true
  posting_period_must_be_open: true
  journal_must_balance: true
  source_transaction_reference_required: true

# ---------------------------------------------------------
# Parameters used by warehouse logic and marts (synchronised to
# meta.Setting by scripts/sync_metadata.py).
# ---------------------------------------------------------
reporting:
  # The synthetic data covers calendar 2026; schedules (depreciation,
  # stock positions) are built up to this date.
  as_at_date: '2026-12-31'

cashup:
  # Absolute cash variance (NAD) still treated as BALANCED.
  variance_tolerance_nad: 1.00
  # Difference (NAD) between declared takings and POS sales per payment
  # method that is reported as a reconciliation exception.
  pos_tolerance_nad: 1.00

replenishment:
  # Reorder point = average daily demand x (supplier lead time + safety days).
  safety_stock_days: 7
  # Default lead time when a product has no goods-receipt history.
  default_lead_time_days: 7
  # Stock cover (days of demand) above which stock is excessive.
  excess_cover_days: 60
  # A product with stock but no sale for this many days is slow-moving.
  slow_moving_days: 45
  # Demand window used to average daily sales.
  demand_window_days: 90

purchasing:
  # Invoice net amount may differ from the ordered value by this much (NAD).
  invoice_match_tolerance_nad: 1.00
