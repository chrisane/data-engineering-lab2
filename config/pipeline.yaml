# =========================================================
# PIPELINE DEFINITION (metadata-driven orchestration)
# ---------------------------------------------------------
# Synchronised into the meta schema by scripts/sync_metadata.py; the
# orchestrator (src/warehouse/orchestrator.py) reads it from there.
#
# Mappings name a HANDLER CODE only. Each code is bound to one
# version-controlled implementation in src/warehouse/handlers.py and
# must also be approved below - no SQL or Python is ever taken from
# metadata.
#
# Control severities
#   CRITICAL  stop the pipeline (data integrity at risk)
#   ERROR     stop the pipeline (result untrustworthy)
#   WARNING   record and continue (needs attention, not unsafe)
# Tolerances are absolute (ABSOLUTE) or relative (PERCENT); a tolerance
# other than zero must carry a reason.
# =========================================================

version: "3"

pipeline:
  name: RetailDataPlatform
  # A STARTED pipeline without a heartbeat for this long is ABANDONED.
  stalled_after_minutes: 60
  # Hours of tolerance per update frequency (freshness checks).
  freshness_hours:
    Per shift: 36
    Daily: 36
    Monthly: 840
    Quarterly: 2400
    On change: 8760
  # Staging batches kept per source before older ones may be archived.
  staging_batches_retained: 3

# Sources that are not files in data/incoming.
# Warehouse tables seeded by a migration rather than loaded by a mapping
# (documented here so every warehouse column has lineage).
static_tables:
  dw.DimPaymentMethod:
    seeded_by: sql/017_warehouse_dimensions.sql
    columns:
      PaymentMethodKey: {rule: "Fixed key: 1 CASH, 2 CARD, 3 CREDIT; -1 = Unknown"}
      PaymentMethodCode: {from: sales_transactions.payment_method, rule: Payment method code used by POS}
      PaymentMethodName: {rule: Display name}
      IsCash: {rule: True for CASH}
      SettlementType: {rule: "IMMEDIATE (cash, card) or ON_ACCOUNT (credit)"}
      CashupLabel: {from: branch_cashup labels, rule: Label of the takings line on branch cash-up documents}

reference_sources:
  chart_of_accounts:
    type: Reference
    path: config/chart_of_accounts.csv
    staging_table: stg.ChartOfAccounts
    description: Chart of accounts maintained by Finance (configuration-controlled reference data).
    data_owner: Chief Financial Officer (Finance)
    data_steward: General Ledger Accountant (Finance)
    classification: Internal
  calendar:
    type: Generated
    description: Calendar generated by the warehouse (dw.usp_LoadDimDate).
    data_owner: Data Engineering
    data_steward: Data Engineering
    classification: Public

# ---------------------------------------------------------
# Approved handlers (implementation: src/warehouse/handlers.py)
# ---------------------------------------------------------
handlers:
  GENERIC_STAGING:    {type: PYTHON, approved: true, description: Contract-driven loader for any registered file source into its staging table}
  SUPPLIER_STAGING:   {type: PYTHON, approved: true, description: Supplier staging loader (generic loader bound to supplier_master)}
  REFERENCE_ACCOUNTS: {type: PYTHON, approved: true, description: Chart of accounts CSV into stg.ChartOfAccounts}
  SUPPLIER_SCD2:      {type: PYTHON, approved: true, description: Supplier SCD Type 2 warehouse transformation runner}
  DIM_DATE:           {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadDimDate}
  DIM_SITE:           {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadDimSite}
  DIM_DEPARTMENT:     {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadDimDepartment}
  DIM_PRODUCT:        {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadDimProduct}
  DIM_CUSTOMER:       {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadDimCustomer}
  DIM_ACCOUNT:        {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadDimAccount}
  DIM_ASSET:          {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadDimAsset}
  DIM_LOCAL_ASSET:    {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadDimLocalAsset}
  FACT_SALES:         {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadFactSales}
  FACT_SALES_LINE:    {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadFactSalesLine}
  FACT_INVENTORY_MOVEMENT: {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadFactInventoryMovement}
  FACT_INVENTORY_SNAPSHOT: {type: STORED_PROCEDURE, approved: true, description: dw.usp_BuildFactInventorySnapshot}
  FACT_PURCHASE_ORDER:      {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadFactPurchaseOrder}
  FACT_PURCHASE_ORDER_LINE: {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadFactPurchaseOrderLine}
  FACT_GOODS_RECEIPT:       {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadFactGoodsReceipt}
  FACT_SUPPLIER_INVOICE:    {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadFactSupplierInvoice}
  FACT_SUPPLIER_REBATE:     {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadFactSupplierRebate}
  FACT_GENERAL_LEDGER:      {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadFactGeneralLedger}
  FACT_OPERATING_EXPENSE:   {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadFactOperatingExpense}
  FACT_ASSET_DEPRECIATION:  {type: STORED_PROCEDURE, approved: true, description: dw.usp_BuildFactAssetDepreciation}
  FACT_BRANCH_CASHUP:       {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadFactBranchCashup}
  BRIDGE_PRODUCT_SUPPLIER:  {type: STORED_PROCEDURE, approved: true, description: dw.usp_LoadBridgeProductSupplier}
  MART_REPLENISHMENT_PLAN:  {type: STORED_PROCEDURE, approved: true, description: mart.usp_BuildReplenishmentPlan}
  # Reconciliation handlers (post-load quality gates)
  RECON_ROW_COUNT:        {type: RECONCILIATION, approved: true, description: Validated source rows equal staged rows for the batch}
  RECON_HASH_LINEAGE:     {type: RECONCILIATION, approved: true, description: Staged rows carry the gate-approved file hash and complete lineage}
  RECON_FRESHNESS:        {type: RECONCILIATION, approved: true, description: Latest new data for the source is within its freshness threshold}
  RECON_WAREHOUSE_AUDIT:  {type: RECONCILIATION, approved: true, description: Warehouse execution counts reconcile to the staged batch}
  RECON_KEY_COVERAGE:     {type: RECONCILIATION, approved: true, description: Every staged business key is present (and active) in the target}
  RECON_MEASURE_TOTAL:    {type: RECONCILIATION, approved: true, description: Staged and warehouse totals of a measure agree within tolerance}
  RECON_UNKNOWN_MEMBERS:  {type: RECONCILIATION, approved: true, description: Fact rows resolved to Unknown (-1) dimension members}
  RECON_SCD2_INTEGRITY:   {type: RECONCILIATION, approved: true, description: One current version per key and no overlapping history}
  RECON_GL_BALANCE:       {type: RECONCILIATION, approved: true, description: Every journal and the ledger as a whole balance}
  RECON_SUPPLIER:         {type: RECONCILIATION, approved: true, description: Existing supplier reconciliation procedure (audit.usp_ReconcileSupplier)}

# Controls applied to every mapping of a layer (unless listed in skip_default_controls).
default_controls:
  STAGING:
    - {name: ROW_COUNT, handler: RECON_ROW_COUNT, severity: CRITICAL}
    - {name: HASH_LINEAGE, handler: RECON_HASH_LINEAGE, severity: CRITICAL}
    - {name: FRESHNESS, handler: RECON_FRESHNESS, severity: WARNING, mandatory: false}
  WAREHOUSE:
    - {name: WAREHOUSE_AUDIT, handler: RECON_WAREHOUSE_AUDIT, severity: CRITICAL}

# ---------------------------------------------------------
# Mappings
# ---------------------------------------------------------
# Staging mappings for every registered source are created automatically
# (code STG_<TABLE>, handler GENERIC_STAGING, strategy APPEND, order 10),
# except where listed here with overrides.
staging:
  supplier_master: {code: STG_SUPPLIER, handler: SUPPLIER_STAGING}
  chart_of_accounts: {code: STG_CHART_OF_ACCOUNTS, handler: REFERENCE_ACCOUNTS}

mappings:

  # ----------------------------- dimensions
  - code: DW_DIM_DATE
    source: calendar
    target: dw.DimDate
    strategy: FULL_REFRESH
    handler: DIM_DATE
    order: 20
    skip_default_controls: [WAREHOUSE_AUDIT]
    description: Calendar 2020-2030 (idempotent; adds missing dates only).
    columns:
      DateKey: {rule: "YYYYMMDD integer; -1 = Unknown"}
      Date: {rule: Calendar date}
      Year: {rule: YEAR(Date)}
      QuarterNumber: {rule: DATEPART(QUARTER)}
      QuarterName: {rule: "Q1..Q4"}
      MonthNumber: {rule: MONTH(Date)}
      MonthName: {rule: DATENAME(MONTH)}
      MonthShortName: {rule: First three letters of MonthName}
      YearMonth: {rule: "YYYY-MM"}
      DayOfMonth: {rule: DAY(Date)}
      DayOfWeekNumber: {rule: "1 = Monday ... 7 = Sunday"}
      DayName: {rule: DATENAME(WEEKDAY)}
      IsoWeek: {rule: ISO week number}
      IsWeekend: {rule: Saturday or Sunday}
      FiscalYear: {rule: "Calendar year shifted by company.financial_year_start_month"}
      FiscalPeriod: {rule: "Month number within the fiscal year"}
      MonthStartDate: {rule: First day of the month}
      MonthEndDate: {rule: EOMONTH(Date)}
      IsMonthEnd: {rule: Date = MonthEndDate}

  - code: DW_DIM_SITE
    source: site_master
    target: dw.DimSite
    strategy: SCD1
    handler: DIM_SITE
    order: 30
    depends_on: [STG_SITE]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.Site, staging_key: [site_id], target_table: dw.DimSite, target_key: [SiteID], target_filter: active}}
    columns:
      SiteKey: {rule: Surrogate key (IDENTITY); -1 = Unknown}
      SiteID: {from: site_id, rule: Business key}
      SiteName: {from: site_name, rule: Copied}
      Town: {from: town, rule: Copied}
      SiteType: {from: site_type, rule: Copied}
      IsBranch: {from: site_type, rule: "site_type = BRANCH"}
      IsDistributionCentre: {from: site_type, rule: "site_type = DISTRIBUTION_CENTRE"}
      IsHeadOffice: {from: site_type, rule: "site_type = HEAD_OFFICE"}

  - code: DW_DIM_DEPARTMENT
    source: department_master
    target: dw.DimDepartment
    strategy: SCD1
    handler: DIM_DEPARTMENT
    order: 30
    depends_on: [STG_DEPARTMENT]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.Department, staging_key: [department_id], target_table: dw.DimDepartment, target_key: [DepartmentID], target_filter: active}}
    columns:
      DepartmentKey: {rule: Surrogate key (IDENTITY); -1 = Unknown}
      DepartmentID: {from: department_id, rule: Business key}
      DepartmentName: {from: department_name, rule: Copied}

  - code: DW_DIM_PRODUCT
    source: product_master
    target: dw.DimProduct
    strategy: SCD2
    handler: DIM_PRODUCT
    order: 30
    depends_on: [STG_PRODUCT]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.Product, staging_key: [product_id], target_table: dw.DimProduct, target_key: [ProductID], target_filter: current}}
      - {name: SCD2_INTEGRITY, handler: RECON_SCD2_INTEGRITY, severity: CRITICAL,
         params: {target_table: dw.DimProduct, target_key: ProductID}}
    columns:
      ProductKey: {rule: Surrogate key per version (IDENTITY); -1 = Unknown}
      ProductID: {from: product_id, rule: Business key}
      ProductName: {from: product_name, rule: Copied; change creates a new version}
      Category: {from: category, rule: Copied; change creates a new version}
      StandardCost: {from: standard_cost, rule: Copied; change creates a new version}
      SellingPrice: {from: selling_price, rule: Copied; change creates a new version}
      IsDCStocked: {from: dc_stocked, rule: Copied}
      SupplyRoute: {from: dc_stocked, rule: "DC_REPLENISHED when dc_stocked else DIRECT_FROM_SUPPLIER"}

  - code: DW_DIM_CUSTOMER
    source: customer_master
    target: dw.DimCustomer
    strategy: SCD2
    handler: DIM_CUSTOMER
    order: 30
    depends_on: [STG_CUSTOMER]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.Customer, staging_key: [customer_id], target_table: dw.DimCustomer, target_key: [CustomerID], target_filter: current}}
      - {name: SCD2_INTEGRITY, handler: RECON_SCD2_INTEGRITY, severity: CRITICAL,
         params: {target_table: dw.DimCustomer, target_key: CustomerID}}
    columns:
      CustomerKey: {rule: Surrogate key per version (IDENTITY); -1 = Unknown}
      CustomerID: {from: customer_id, rule: Business key}
      CustomerName: {from: customer_name, rule: "Copied (RESTRICTED: personal data)"}
      CustomerType: {from: customer_type, rule: Copied; change creates a new version}
      Town: {from: town, rule: "Copied (RESTRICTED: personal data)"}
      CreditLimit: {from: credit_limit, rule: Copied; change creates a new version}
      HasCreditFacility: {from: credit_limit, rule: "credit_limit > 0"}

  - code: DW_DIM_SUPPLIER
    source: supplier_master
    target: dw.DimSupplier
    strategy: SCD2
    handler: SUPPLIER_SCD2
    order: 30
    depends_on: [STG_SUPPLIER]
    controls:
      - {name: SUPPLIER_RECONCILIATION, handler: RECON_SUPPLIER, severity: CRITICAL}
    columns:
      SupplierKey: {rule: Surrogate key per version (IDENTITY); -1 = Unknown}
      SupplierID: {from: supplier_id, rule: Business key}
      SupplierName: {from: supplier_name, rule: Copied; change creates a new version}
      Location: {from: location, rule: Copied; change creates a new version}
      MinimumOrderValueNAD: {from: minimum_order_value_nad, rule: Copied; change creates a new version}
      RebateRate: {from: rebate_rate, rule: Copied; change creates a new version}
      PaymentTermsDays: {from: payment_terms_days, rule: Copied; change creates a new version}
      ChangeReason: {rule: Reason recorded for the version}

  - code: DW_DIM_ACCOUNT
    source: chart_of_accounts
    target: dw.DimAccount
    strategy: SCD1
    handler: DIM_ACCOUNT
    order: 30
    depends_on: [STG_CHART_OF_ACCOUNTS]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.ChartOfAccounts, staging_key: [account_code], target_table: dw.DimAccount, target_key: [AccountCode], target_filter: active}}
    columns:
      AccountKey: {rule: Surrogate key (IDENTITY); -1 = Unknown}
      AccountCode: {from: account_code, rule: Business key}
      AccountName: {from: account_name, rule: Copied}
      AccountType: {from: account_type, rule: Copied}
      FinancialStatement: {from: financial_statement, rule: Copied}
      NormalBalance: {from: normal_balance, rule: Copied}
      NormalSign: {from: normal_balance, rule: "+1 Debit, -1 Credit"}
      StatementSection: {from: account_type, rule: "Assets / Liabilities / Equity / Revenue / Expenses from account_type"}

  - code: DW_DIM_ASSET
    source: fixed_assets_erp
    target: dw.DimAsset
    strategy: SCD1
    handler: DIM_ASSET
    order: 30
    depends_on: [STG_FIXED_ASSET]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.FixedAsset, staging_key: [asset_id], target_table: dw.DimAsset, target_key: [AssetID], target_filter: active}}
      - {name: COST_TOTAL, handler: RECON_MEASURE_TOTAL, severity: ERROR, tolerance: 0.01,
         tolerance_reason: Cent rounding,
         params: {staging_table: stg.FixedAsset, staging_measure: acquisition_cost, target_table: dw.DimAsset, target_measure: AcquisitionCost}}
    columns:
      AssetKey: {rule: Surrogate key (IDENTITY); -1 = Unknown}
      AssetID: {from: asset_id, rule: Business key (unique ERP asset number)}
      SiteID: {from: site_id, rule: Copied}
      AssetClass: {from: asset_class, rule: Copied}
      AcquisitionDate: {from: acquisition_date, rule: Copied}
      AcquisitionCost: {from: acquisition_cost, rule: Copied}
      UsefulLifeYears: {from: useful_life_years, rule: Copied}
      MonthlyDepreciation: {from: monthly_depreciation, rule: Copied}
      SourceAccumulatedDepreciation: {from: accumulated_depreciation, rule: As reported by the ERP register}
      SourceNetBookValue: {from: net_book_value, rule: As reported by the ERP register}
      DepreciationMethod: {rule: "STRAIGHT_LINE (business_rules.yaml assets.depreciation_method)"}
      AssetStatus: {from: status, rule: Copied}
      FullyDepreciatedDate: {from: "acquisition_date, useful_life_years", rule: "EOMONTH(acquisition_date + useful life)"}

  - code: DW_DIM_LOCAL_ASSET
    source: branch_local_assets
    target: dw.DimLocalAsset
    strategy: SCD1
    handler: DIM_LOCAL_ASSET
    order: 30
    depends_on: [STG_BRANCH_LOCAL_ASSET]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.BranchLocalAsset, staging_key: [local_asset_id], target_table: dw.DimLocalAsset, target_key: [LocalAssetID], target_filter: active}}
    columns:
      LocalAssetKey: {rule: Surrogate key (IDENTITY); -1 = Unknown}
      LocalAssetID: {from: local_asset_id, rule: Business key}
      SiteID: {from: site_id, rule: Copied}
      DepartmentID: {from: department_id, rule: Copied}
      AssetDescription: {from: description, rule: Copied}
      AssetCondition: {from: condition, rule: Copied}
      AssignedTo: {from: assigned_to, rule: "Copied (CONFIDENTIAL: employee name)"}
      IsAssigned: {from: assigned_to, rule: assigned_to is not blank}
      RecordedDate: {from: recorded_date, rule: Copied}

  - code: DW_BRIDGE_PRODUCT_SUPPLIER
    source: product_supplier
    target: dw.BridgeProductSupplier
    strategy: SCD1
    handler: BRIDGE_PRODUCT_SUPPLIER
    order: 40
    depends_on: [STG_PRODUCT_SUPPLIER, DW_DIM_PRODUCT, DW_DIM_SUPPLIER]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.ProductSupplier, staging_key: [product_id, supplier_id], target_table: dw.BridgeProductSupplier, target_key: [ProductID, SupplierID], target_filter: active}}
      - {name: UNKNOWN_MEMBERS, handler: RECON_UNKNOWN_MEMBERS, severity: ERROR}
    columns:
      ProductSupplierKey: {rule: Surrogate key (IDENTITY)}
      ProductID: {from: product_id, rule: Business key part 1}
      SupplierID: {from: supplier_id, rule: Business key part 2}
      ProductKey: {from: product_id, rule: Current DimProduct version}
      SupplierKey: {from: supplier_id, rule: Current DimSupplier version}
      SupplierUnitCost: {from: supplier_unit_cost, rule: Copied}
      IsPreferredSupplier: {from: supplier_unit_cost, rule: Lowest agreed unit cost for the product (ties by supplier ID)}

  # ----------------------------- facts
  - code: DW_FACT_SALES
    source: sales_transactions
    target: dw.FactSales
    strategy: UPSERT
    handler: FACT_SALES
    order: 50
    depends_on: [STG_SALES_TRANSACTION, DW_DIM_DATE, DW_DIM_SITE, DW_DIM_CUSTOMER]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.SalesTransaction, staging_key: [sale_id], target_table: dw.FactSales, target_key: [SaleID], target_filter: active}}
      - {name: TOTAL_AMOUNT, handler: RECON_MEASURE_TOTAL, severity: ERROR, tolerance: 0.01, tolerance_reason: Cent rounding,
         params: {staging_table: stg.SalesTransaction, staging_measure: total_amount, target_table: dw.FactSales, target_measure: TotalAmount}}
      - {name: UNKNOWN_MEMBERS, handler: RECON_UNKNOWN_MEMBERS, severity: ERROR}
    columns:
      SalesKey: {rule: Surrogate key (IDENTITY)}
      SaleID: {from: sale_id, rule: Business key (degenerate dimension)}
      SaleDateKey: {from: sale_date, rule: YYYYMMDD of sale_date}
      SiteKey: {from: site_id, rule: DimSite lookup by SiteID; -1 if missing}
      CustomerKey: {from: customer_id, rule: Current DimCustomer version at load; -1 if missing}
      PaymentMethodKey: {from: payment_method, rule: DimPaymentMethod lookup by code}
      NetAmount: {from: net_amount, rule: Copied}
      VATAmount: {from: vat_amount, rule: Copied}
      TotalAmount: {from: total_amount, rule: Copied}

  - code: DW_FACT_SALES_LINE
    source: sales_lines
    target: dw.FactSalesLine
    strategy: UPSERT
    handler: FACT_SALES_LINE
    order: 50
    depends_on: [STG_SALES_LINE, STG_SALES_TRANSACTION, DW_DIM_DATE, DW_DIM_SITE, DW_DIM_CUSTOMER, DW_DIM_PRODUCT]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.SalesLine, staging_key: [sale_id, product_id], target_table: dw.FactSalesLine, target_key: [SaleID, ProductID], target_filter: active}}
      - {name: LINE_NET_TOTAL, handler: RECON_MEASURE_TOTAL, severity: ERROR, tolerance: 0.01, tolerance_reason: Cent rounding,
         params: {staging_table: stg.SalesLine, staging_measure: line_net, target_table: dw.FactSalesLine, target_measure: LineNetAmount}}
      - {name: UNKNOWN_MEMBERS, handler: RECON_UNKNOWN_MEMBERS, severity: ERROR}
    columns:
      SalesLineKey: {rule: Surrogate key (IDENTITY)}
      SaleID: {from: sale_id, rule: Business key part 1}
      ProductID: {from: product_id, rule: Business key part 2}
      SaleDateKey: {from: sales_transactions.sale_date, rule: Header sale date}
      SiteKey: {from: sales_transactions.site_id, rule: Header site}
      CustomerKey: {from: sales_transactions.customer_id, rule: Header customer (current version)}
      ProductKey: {from: product_id, rule: Current DimProduct version at load}
      PaymentMethodKey: {from: sales_transactions.payment_method, rule: Header payment method}
      Quantity: {from: quantity, rule: Copied}
      UnitPrice: {from: unit_price, rule: Copied}
      LineNetAmount: {from: line_net, rule: Copied}
      UnitCost: {from: unit_cost, rule: Copied}
      LineCostAmount: {from: "quantity, unit_cost", rule: ROUND(quantity x unit_cost, 2)}
      GrossMarginAmount: {from: "line_net, quantity, unit_cost", rule: LineNetAmount - LineCostAmount}

  - code: DW_FACT_INVENTORY_MOVEMENT
    source: inventory_movements
    target: dw.FactInventoryMovement
    strategy: UPSERT
    handler: FACT_INVENTORY_MOVEMENT
    order: 50
    depends_on: [STG_INVENTORY_MOVEMENT, DW_DIM_DATE, DW_DIM_SITE, DW_DIM_PRODUCT]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.InventoryMovement, staging_key: [movement_id], target_table: dw.FactInventoryMovement, target_key: [MovementID], target_filter: active}}
      - {name: QUANTITY_TOTAL, handler: RECON_MEASURE_TOTAL, severity: CRITICAL, tolerance: 0,
         params: {staging_table: stg.InventoryMovement, staging_measure: quantity, target_table: dw.FactInventoryMovement, target_measure: Quantity}}
      - {name: UNKNOWN_MEMBERS, handler: RECON_UNKNOWN_MEMBERS, severity: ERROR}
    columns:
      InventoryMovementKey: {rule: Surrogate key (IDENTITY)}
      MovementID: {from: movement_id, rule: Business key}
      MovementDateKey: {from: movement_date, rule: YYYYMMDD}
      SiteKey: {from: site_id, rule: DimSite lookup}
      ProductKey: {from: product_id, rule: Current DimProduct version}
      MovementType: {from: movement_type, rule: Copied}
      Direction: {from: quantity, rule: "IN when quantity >= 0 else OUT"}
      Quantity: {from: quantity, rule: Copied (signed)}
      UnitCost: {from: unit_cost, rule: Copied}
      MovementValue: {from: "quantity, unit_cost", rule: ROUND(quantity x unit_cost, 2)}
      SourceDocumentID: {from: source_document_id, rule: Copied}

  - code: DW_FACT_INVENTORY_SNAPSHOT
    source: inventory_movements
    target: dw.FactInventorySnapshot
    strategy: FULL_REFRESH
    handler: FACT_INVENTORY_SNAPSHOT
    order: 60
    depends_on: [DW_FACT_INVENTORY_MOVEMENT]
    columns:
      SnapshotDateKey: {from: dw.FactInventoryMovement, rule: Month end}
      SiteKey: {from: dw.FactInventoryMovement, rule: Copied}
      ProductKey: {from: dw.FactInventoryMovement, rule: Copied}
      QuantityIn: {from: dw.FactInventoryMovement.Quantity, rule: Sum of positive quantities in the month}
      QuantityOut: {from: dw.FactInventoryMovement.Quantity, rule: Sum of negative quantities in the month (as positive)}
      ClosingQuantity: {from: dw.FactInventoryMovement.Quantity, rule: Running sum of all movements to month end}
      ClosingValue: {from: dw.DimProduct.StandardCost, rule: ClosingQuantity x current standard cost}

  - code: DW_FACT_PURCHASE_ORDER
    source: purchase_orders
    target: dw.FactPurchaseOrder
    strategy: UPSERT
    handler: FACT_PURCHASE_ORDER
    order: 50
    depends_on: [STG_PURCHASE_ORDER, DW_DIM_DATE, DW_DIM_SITE, DW_DIM_SUPPLIER]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.PurchaseOrder, staging_key: [po_id], target_table: dw.FactPurchaseOrder, target_key: [POID], target_filter: active}}
      - {name: PO_VALUE_TOTAL, handler: RECON_MEASURE_TOTAL, severity: ERROR, tolerance: 0.01, tolerance_reason: Cent rounding,
         params: {staging_table: stg.PurchaseOrder, staging_measure: po_value, target_table: dw.FactPurchaseOrder, target_measure: POValue}}
      - {name: UNKNOWN_MEMBERS, handler: RECON_UNKNOWN_MEMBERS, severity: ERROR}
    columns:
      PurchaseOrderKey: {rule: Surrogate key (IDENTITY)}
      POID: {from: po_id, rule: Business key}
      OrderDateKey: {from: po_date, rule: YYYYMMDD}
      SupplierKey: {from: supplier_id, rule: Current DimSupplier version}
      DeliverySiteKey: {from: delivery_site_id, rule: DimSite lookup}
      POStatus: {from: status, rule: Copied}
      POValue: {from: po_value, rule: Copied}
      SupplierMinimumOrderValue: {from: dw.DimSupplier.MinimumOrderValueNAD, rule: Supplier's current minimum order value (NAD)}
      MeetsMinimumOrderValue: {from: "po_value, MinimumOrderValueNAD", rule: po_value >= minimum order value}

  - code: DW_FACT_PURCHASE_ORDER_LINE
    source: purchase_order_lines
    target: dw.FactPurchaseOrderLine
    strategy: UPSERT
    handler: FACT_PURCHASE_ORDER_LINE
    order: 50
    depends_on: [STG_PURCHASE_ORDER_LINE, STG_PURCHASE_ORDER, DW_DIM_DATE, DW_DIM_SITE, DW_DIM_SUPPLIER, DW_DIM_PRODUCT]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.PurchaseOrderLine, staging_key: [po_id, product_id], target_table: dw.FactPurchaseOrderLine, target_key: [POID, ProductID], target_filter: active}}
      - {name: LINE_VALUE_TOTAL, handler: RECON_MEASURE_TOTAL, severity: ERROR, tolerance: 0.01, tolerance_reason: Cent rounding,
         params: {staging_table: stg.PurchaseOrderLine, staging_measure: line_value, target_table: dw.FactPurchaseOrderLine, target_measure: LineValue}}
      - {name: UNKNOWN_MEMBERS, handler: RECON_UNKNOWN_MEMBERS, severity: ERROR}
    columns:
      PurchaseOrderLineKey: {rule: Surrogate key (IDENTITY)}
      POID: {from: po_id, rule: Business key part 1}
      ProductID: {from: product_id, rule: Business key part 2}
      OrderDateKey: {from: purchase_orders.po_date, rule: Header order date}
      SupplierKey: {from: purchase_orders.supplier_id, rule: Header supplier (current version)}
      ProductKey: {from: product_id, rule: Current DimProduct version}
      DeliverySiteKey: {from: purchase_orders.delivery_site_id, rule: Header delivery site}
      Quantity: {from: quantity, rule: Copied}
      UnitCost: {from: unit_cost, rule: Copied}
      LineValue: {from: line_value, rule: Copied}

  - code: DW_FACT_GOODS_RECEIPT
    source: goods_receipts
    target: dw.FactGoodsReceipt
    strategy: UPSERT
    handler: FACT_GOODS_RECEIPT
    order: 50
    depends_on: [STG_GOODS_RECEIPT, STG_PURCHASE_ORDER, DW_DIM_DATE, DW_DIM_SITE, DW_DIM_SUPPLIER]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.GoodsReceipt, staging_key: [grn_id], target_table: dw.FactGoodsReceipt, target_key: [GRNID], target_filter: active}}
      - {name: UNKNOWN_MEMBERS, handler: RECON_UNKNOWN_MEMBERS, severity: ERROR}
    columns:
      GoodsReceiptKey: {rule: Surrogate key (IDENTITY)}
      GRNID: {from: grn_id, rule: Business key}
      POID: {from: po_id, rule: Copied}
      ReceiptDateKey: {from: receipt_date, rule: YYYYMMDD}
      OrderDateKey: {from: purchase_orders.po_date, rule: Order date of the related PO}
      SupplierKey: {from: supplier_id, rule: Current DimSupplier version}
      SiteKey: {from: site_id, rule: DimSite lookup}
      LeadTimeDays: {from: "po_date, receipt_date", rule: receipt_date - po_date (days)}

  - code: DW_FACT_SUPPLIER_INVOICE
    source: supplier_invoices
    target: dw.FactSupplierInvoice
    strategy: UPSERT
    handler: FACT_SUPPLIER_INVOICE
    order: 50
    depends_on: [STG_SUPPLIER_INVOICE, STG_PURCHASE_ORDER, DW_DIM_DATE, DW_DIM_SUPPLIER]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.SupplierInvoice, staging_key: [invoice_id], target_table: dw.FactSupplierInvoice, target_key: [InvoiceID], target_filter: active}}
      - {name: TOTAL_AMOUNT, handler: RECON_MEASURE_TOTAL, severity: ERROR, tolerance: 0.01, tolerance_reason: Cent rounding,
         params: {staging_table: stg.SupplierInvoice, staging_measure: total_amount, target_table: dw.FactSupplierInvoice, target_measure: TotalAmount}}
      - {name: UNKNOWN_MEMBERS, handler: RECON_UNKNOWN_MEMBERS, severity: ERROR}
    columns:
      SupplierInvoiceKey: {rule: Surrogate key (IDENTITY)}
      InvoiceID: {from: invoice_id, rule: Business key}
      POID: {from: po_id, rule: Copied}
      InvoiceDateKey: {from: invoice_date, rule: YYYYMMDD}
      DueDateKey: {from: "invoice_date, dw.DimSupplier.PaymentTermsDays", rule: invoice_date + supplier payment terms}
      SupplierKey: {from: supplier_id, rule: Current DimSupplier version}
      InvoiceStatus: {from: status, rule: Copied}
      NetAmount: {from: net_amount, rule: Copied}
      VATAmount: {from: vat_amount, rule: Copied}
      TotalAmount: {from: total_amount, rule: Copied}
      PaymentTermsDays: {from: dw.DimSupplier.PaymentTermsDays, rule: Supplier's current payment terms}
      OrderedValue: {from: purchase_orders.po_value, rule: Value of the related PO}
      InvoiceToOrderVariance: {from: "net_amount, po_value", rule: net_amount - po_value}

  - code: DW_FACT_SUPPLIER_REBATE
    source: supplier_rebates
    target: dw.FactSupplierRebate
    strategy: UPSERT
    handler: FACT_SUPPLIER_REBATE
    order: 50
    depends_on: [STG_SUPPLIER_REBATE, DW_DIM_DATE, DW_DIM_SUPPLIER]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.SupplierRebate, staging_key: [supplier_id, period], target_table: dw.FactSupplierRebate, target_key: [SupplierID, RebatePeriod], target_filter: active}}
      - {name: REBATE_TOTAL, handler: RECON_MEASURE_TOTAL, severity: ERROR, tolerance: 0.01, tolerance_reason: Cent rounding,
         params: {staging_table: stg.SupplierRebate, staging_measure: rebate_amount, target_table: dw.FactSupplierRebate, target_measure: RebateAmount}}
      - {name: UNKNOWN_MEMBERS, handler: RECON_UNKNOWN_MEMBERS, severity: ERROR}
    columns:
      SupplierRebateKey: {rule: Surrogate key (IDENTITY)}
      SupplierID: {from: supplier_id, rule: Business key part 1}
      RebatePeriod: {from: period, rule: Business key part 2}
      PeriodEndDateKey: {from: period, rule: Last day of the quarter}
      SupplierKey: {from: supplier_id, rule: Current DimSupplier version}
      QualifyingSpend: {from: qualifying_spend, rule: Copied}
      RebateRate: {from: rebate_rate, rule: Copied}
      RebateAmount: {from: rebate_amount, rule: Copied}
      ExpectedRebateRate: {from: "qualifying_spend, meta.RebateThreshold", rule: Highest threshold rate reached by qualifying spend}
      ExpectedRebateAmount: {from: qualifying_spend, rule: qualifying_spend x expected rate}
      RebateVariance: {from: rebate_amount, rule: RebateAmount - ExpectedRebateAmount}

  - code: DW_FACT_GENERAL_LEDGER
    source: general_ledger
    target: dw.FactGeneralLedger
    strategy: UPSERT
    handler: FACT_GENERAL_LEDGER
    order: 50
    depends_on: [STG_GENERAL_LEDGER, DW_DIM_DATE, DW_DIM_SITE, DW_DIM_ACCOUNT]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.GeneralLedger, staging_key: [journal_id], target_table: dw.FactGeneralLedger, target_key: [JournalID], target_filter: active}}
      - {name: DEBIT_TOTAL, handler: RECON_MEASURE_TOTAL, severity: CRITICAL, tolerance: 0.01, tolerance_reason: Cent rounding,
         params: {staging_table: stg.GeneralLedger, staging_measure: debit, target_table: dw.FactGeneralLedger, target_measure: DebitAmount}}
      - {name: CREDIT_TOTAL, handler: RECON_MEASURE_TOTAL, severity: CRITICAL, tolerance: 0.01, tolerance_reason: Cent rounding,
         params: {staging_table: stg.GeneralLedger, staging_measure: credit, target_table: dw.FactGeneralLedger, target_measure: CreditAmount}}
      - {name: LEDGER_BALANCE, handler: RECON_GL_BALANCE, severity: CRITICAL, tolerance: 0.01, tolerance_reason: Cent rounding}
      - {name: UNKNOWN_MEMBERS, handler: RECON_UNKNOWN_MEMBERS, severity: CRITICAL}
    columns:
      GeneralLedgerKey: {rule: Surrogate key (IDENTITY)}
      JournalID: {from: journal_id, rule: Business key part 1}
      JournalLineNumber: {from: SourceRowNumber, rule: Position of the line within its journal in the source file}
      PostingDateKey: {from: posting_date, rule: YYYYMMDD}
      AccountKey: {from: account_code, rule: DimAccount lookup}
      SiteKey: {from: site_id, rule: DimSite lookup}
      SourceDocumentID: {from: source_document_id, rule: Copied (lineage to the operational document)}
      TransactionType: {from: transaction_type, rule: Copied}
      DebitAmount: {from: debit, rule: Copied (blank = 0)}
      CreditAmount: {from: credit, rule: Copied (blank = 0)}
      NetAmount: {from: "debit, credit", rule: debit - credit}

  - code: DW_FACT_OPERATING_EXPENSE
    source: operating_expenses
    target: dw.FactOperatingExpense
    strategy: UPSERT
    handler: FACT_OPERATING_EXPENSE
    order: 50
    depends_on: [STG_OPERATING_EXPENSE, DW_DIM_DATE, DW_DIM_SITE, DW_DIM_ACCOUNT]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.OperatingExpense, staging_key: [expense_id], target_table: dw.FactOperatingExpense, target_key: [ExpenseID], target_filter: active}}
      - {name: AMOUNT_TOTAL, handler: RECON_MEASURE_TOTAL, severity: ERROR, tolerance: 0.01, tolerance_reason: Cent rounding,
         params: {staging_table: stg.OperatingExpense, staging_measure: amount, target_table: dw.FactOperatingExpense, target_measure: Amount}}
      - {name: UNKNOWN_MEMBERS, handler: RECON_UNKNOWN_MEMBERS, severity: ERROR}
    columns:
      OperatingExpenseKey: {rule: Surrogate key (IDENTITY)}
      ExpenseID: {from: expense_id, rule: Business key}
      ExpenseDateKey: {from: expense_date, rule: YYYYMMDD}
      SiteKey: {from: site_id, rule: DimSite lookup}
      AccountKey: {from: "expense_type, config/posting_rules.csv", rule: Debit account of the posting rule for the expense type}
      ExpenseType: {from: expense_type, rule: Copied}
      ExpenseDescription: {from: description, rule: Copied}
      Amount: {from: amount, rule: Copied}

  - code: DW_FACT_ASSET_DEPRECIATION
    source: fixed_assets_erp
    target: dw.FactAssetDepreciation
    strategy: FULL_REFRESH
    handler: FACT_ASSET_DEPRECIATION
    order: 60
    depends_on: [DW_DIM_ASSET, DW_DIM_SITE, DW_DIM_DATE]
    columns:
      AssetKey: {from: dw.DimAsset, rule: Copied}
      PeriodEndDateKey: {from: dw.DimDate, rule: Each month end after acquisition until fully depreciated or the as-at date}
      SiteKey: {from: dw.DimAsset.SiteID, rule: DimSite lookup}
      DepreciationAmount: {from: dw.DimAsset.MonthlyDepreciation, rule: Monthly straight-line amount; final month absorbs rounding}
      AccumulatedDepreciation: {from: dw.DimAsset, rule: Running total capped at acquisition cost}
      NetBookValue: {from: dw.DimAsset.AcquisitionCost, rule: AcquisitionCost - AccumulatedDepreciation}

  - code: DW_FACT_BRANCH_CASHUP
    source: branch_cashup
    target: dw.FactBranchCashup
    strategy: UPSERT
    handler: FACT_BRANCH_CASHUP
    order: 50
    depends_on: [STG_BRANCH_CASHUP, DW_DIM_DATE, DW_DIM_SITE]
    controls:
      - {name: KEY_COVERAGE, handler: RECON_KEY_COVERAGE, severity: CRITICAL,
         params: {staging_table: stg.BranchCashup, staging_key: [shift_id], target_table: dw.FactBranchCashup, target_key: [ShiftID], target_filter: all}}
      - {name: UNKNOWN_MEMBERS, handler: RECON_UNKNOWN_MEMBERS, severity: ERROR}
    columns:
      BranchCashupKey: {rule: Surrogate key (IDENTITY)}
      ShiftID: {from: shift_id, rule: Business key (one document per shift)}
      BusinessDateKey: {from: business_date, rule: YYYYMMDD}
      SiteKey: {from: site_code, rule: DimSite lookup by SiteID}
      PosTerminal: {from: pos_terminal, rule: Copied}
      Cashier: {from: cashier, rule: "Copied (CONFIDENTIAL: employee name)"}
      OpeningFloat: {from: opening_float, rule: Copied}
      CashSales: {from: cash_sales, rule: Copied (as declared on the cash-up)}
      CardSales: {from: card_sales, rule: Copied}
      AccountSales: {from: account_sales, rule: Copied}
      TotalSales: {from: total_sales, rule: Copied}
      InternalExpenses: {from: internal_expenses, rule: Copied (blank = 0)}
      CashRemoved: {from: cash_removed, rule: Copied}
      ExpectedClosingCash: {from: expected_closing_cash, rule: Copied}
      ActualClosingCash: {from: actual_closing_cash, rule: Copied}
      CashVariance: {from: variance, rule: Copied (actual - expected)}
      CashVarianceStatus: {from: variance, rule: "BALANCED within cashup.variance_tolerance_nad, else SHORTAGE / OVERAGE"}
      ManagerApproval: {from: manager_approval, rule: Copied}
      SourceFile: {from: file name, rule: Cash-up document file name}

  # ----------------------------- materialised marts
  - code: MART_REPLENISHMENT_PLAN
    source: inventory_movements
    layer: MART
    target: mart.ReplenishmentPlan
    strategy: FULL_REFRESH
    handler: MART_REPLENISHMENT_PLAN
    order: 70
    depends_on: [DW_FACT_INVENTORY_MOVEMENT, DW_FACT_PURCHASE_ORDER_LINE, DW_FACT_GOODS_RECEIPT, DW_DIM_PRODUCT, DW_DIM_SITE]
    controls:
      - {name: WAREHOUSE_AUDIT, handler: RECON_WAREHOUSE_AUDIT, severity: CRITICAL}
    description: Replenishment plan built once per run (stock, demand, lead time, reorder point, status).
    columns:
      SiteID: {from: dw.DimSite, rule: Branch or distribution centre}
      SiteName: {from: dw.DimSite, rule: Copied}
      SiteType: {from: dw.DimSite, rule: Copied}
      ProductID: {from: dw.DimProduct, rule: Business key}
      ProductName: {from: dw.DimProduct, rule: Current version}
      Category: {from: dw.DimProduct, rule: Current version}
      QuantityOnHand: {from: dw.FactInventoryMovement.Quantity, rule: Sum of movements up to reporting.as_at_date}
      StockValue: {from: dw.DimProduct.StandardCost, rule: QuantityOnHand x current standard cost}
      AvgDailyDemand: {from: dw.FactInventoryMovement, rule: "Sales and transfers out over replenishment.demand_window_days / window"}
      LeadTimeDays: {from: dw.FactGoodsReceipt.LeadTimeDays, rule: "DC: average supplier lead time of the product; branches: replenishment.default_lead_time_days"}
      ReorderPoint: {rule: "AvgDailyDemand x (LeadTimeDays + replenishment.safety_stock_days)"}
      DaysOfCover: {rule: QuantityOnHand / AvgDailyDemand}
      DaysSinceLastOutflow: {from: dw.FactInventoryMovement, rule: Days from the last outflow to the as-at date}
      StockStatus: {rule: "NEGATIVE_STOCK, REORDER, SLOW_MOVING, EXCESS or OK (thresholds in meta.Setting)"}
      AsAtDate: {from: meta.Setting, rule: reporting.as_at_date}
