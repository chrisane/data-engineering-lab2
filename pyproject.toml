[project]
name = "retail-data-platform"
version = "2.0.0"
description = "Retail Data Platform v2 - Nawa Retail Group data engineering lab"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".venv", "data", "logs"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors/warnings, import order, bugbear, security (bandit rules)
select = ["F", "E", "W", "I", "B", "S"]
ignore = [
    "E731",   # lambda assignment is used deliberately in small callbacks
    "B008",   # function call in default argument (none in practice)
    "S101",   # assert is how pytest tests are written
    "S603",   # subprocess calls use fixed, validated argument lists
    "S607",   # git / taskkill are resolved from PATH on purpose
    "S608",   # SQL built only from validated, quoted identifiers (see reconciliation.py)
    "S311",   # random is used for synthetic data generation, not security
    "E402",   # sys.path set-up before imports in runnable scripts
]

[tool.ruff.lint.per-file-ignores]
# The synthetic generator is a compact, single-pass script.
"scripts/generate_all.py" = ["E701", "E702", "E231", "E225", "E501", "I001", "B007"]

[tool.ruff.lint.isort]
known-first-party = [
    "common", "validate_data", "validate_structure", "check_coverage", "load_eligibility",
    "document_extraction", "discover_files", "db_connection", "migrations", "staging_schema",
    "staging_loader", "handlers", "reconciliation", "metadata_sync", "orchestrator",
]

[tool.ruff.format]
exclude = ["scripts/generate_all.py"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "data"]
skips = ["B101", "B311", "B404", "B603", "B607", "B608"]
